<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>My Library</h1>
    <form>
        <div>
            <label for="title-input">Title</label>
            <input type="text" id="title-input" autocomplete="off">
        </div>
        <div>
            <label for="author-input">Author</label>
            <input type="text" id="author-input" autocomplete="off">
        </div>
        <div>
            <label for="pages-input">Pages</label>
            <input type="text" id="pages-input" autocomplete="off">
        </div>
        <div>
            <label for="read-input">Read</label>
            <input type="checkbox" id="read-input">
        </div>
        <div>
            <input type="submit" id="submit-button">
        </div>
    </form>
    
    <div id="header-grid">

    </div>

    <div id="book-grid">
        
    </div>

    <script src="script.js"></script>
</body>
</html>
